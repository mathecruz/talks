<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Matheus Cruz Talks</title>
	<style>
		:root {
			--quarkus-blue: #4695eb;
			--quarkus-red: #ff004a;
			--bg: #ffffff;
			--bg-soft: #f4f7fb;
			--text: #1a1f2b;
			--text-muted: #5b6472;
			--border: #e3e8ef;
			--card-shadow: 0 1px 3px rgba(20, 30, 50, 0.08);
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #0f1216;
				--bg-soft: #171b21;
				--text: #eef1f5;
				--text-muted: #9aa4b2;
				--border: #262b33;
				--card-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
			}
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: var(--bg);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			line-height: 1.5;
		}

		header {
			position: relative;
			padding: 3.5rem 1.5rem 2.5rem;
			text-align: center;
			background: linear-gradient(180deg, var(--bg-soft), var(--bg));
			border-bottom: 1px solid var(--border);
		}

		header .repo-link {
			position: absolute;
			top: 1.25rem;
			right: 1.5rem;
			display: inline-flex;
			color: var(--text-muted);
			transition: color 0.15s ease;
		}

		header .repo-link:hover {
			color: var(--quarkus-red);
		}

		header .repo-link svg {
			width: 26px;
			height: 26px;
			fill: currentColor;
		}

		header h1 {
			margin: 0 0 0.5rem;
			font-size: 2.1rem;
		}

		header h1 span {
			background: linear-gradient(90deg, var(--quarkus-blue), var(--quarkus-red));
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
		}

		header p {
			margin: 0;
			color: var(--text-muted);
		}

		main {
			max-width: 880px;
			margin: 0 auto;
			padding: 2.5rem 1.5rem 4rem;
		}

		.talks {
			display: flex;
			flex-direction: column;
			gap: 1.25rem;
		}

		.talks-status {
			color: var(--text-muted);
			text-align: center;
		}

		.talk {
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 1.5rem 1.75rem;
			background: var(--bg-soft);
			box-shadow: var(--card-shadow);
			position: relative;
		}

		.talk-badge {
			display: inline-block;
			font-size: 0.72rem;
			font-weight: 600;
			letter-spacing: 0.04em;
			text-transform: uppercase;
			padding: 0.2rem 0.6rem;
			border-radius: 999px;
			margin-bottom: 0.75rem;
		}

		.talk-badge.upcoming {
			color: var(--quarkus-red);
			background: rgba(255, 0, 74, 0.1);
		}

		.talk-badge.past {
			color: var(--quarkus-blue);
			background: rgba(70, 149, 235, 0.12);
		}

		.talk h2 {
			margin: 0 0 0.4rem;
			font-size: 1.3rem;
		}

		.talk .meta {
			display: flex;
			flex-wrap: wrap;
			gap: 0.4rem 1rem;
			color: var(--text-muted);
			font-size: 0.92rem;
			margin-bottom: 1rem;
		}

		.talk .meta span::before {
			content: "";
		}

		.talk .links {
			display: flex;
			flex-wrap: wrap;
			gap: 0.6rem;
		}

		.talk .links a {
			display: inline-flex;
			align-items: center;
			gap: 0.4rem;
			text-decoration: none;
			font-size: 0.9rem;
			font-weight: 600;
			padding: 0.45rem 0.9rem;
			border-radius: 8px;
			border: 1px solid var(--border);
			color: var(--text);
			transition: border-color 0.15s ease, color 0.15s ease;
		}

		.talk .links a.primary {
			background: var(--quarkus-blue);
			border-color: var(--quarkus-blue);
			color: #fff;
		}

		.talk .links a:hover {
			border-color: var(--quarkus-red);
			color: var(--quarkus-red);
		}

		.talk .links a.primary:hover {
			background: var(--quarkus-red);
			border-color: var(--quarkus-red);
			color: #fff;
		}

		footer {
			text-align: center;
			color: var(--text-muted);
			font-size: 0.85rem;
			padding: 0 1.5rem 3rem;
		}

		footer a {
			color: inherit;
		}
	</style>
</head>

<body>
	<header>
		<a class="repo-link" href="https://github.com/mathecruz/talks" target="_blank" rel="noopener"
			aria-label="Ver repositório no GitHub">
			<svg viewBox="0 0 16 16" aria-hidden="true">
				<path
					d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
			</svg>
		</a>
		<h1>Matheus Cruz <span>{Talks}</span></h1>
		<p>Slides e projetos de demonstração apresentados em comunidades e eventos.</p>
	</header>

	<main>
		<div class="talks" id="talks">
			<p class="talks-status">Carregando talks…</p>
		</div>
	</main>

	<script>
		function formatDate(isoDate) {
			const [year, month, day] = isoDate.split("-");
			return `${day}/${month}/${year}`;
		}

		function escapeHtml(str) {
			return str.replace(/[&<>"']/g, (c) => ({
				"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
			}[c]));
		}

		const YOUTUBE_ICON = '<svg class="icon-youtube" width="18" height="13" viewBox="0 0 24 24" aria-hidden="true">'
			+ '<path fill="#FF0000" d="M23.498 6.186a2.999 2.999 0 0 0-2.112-2.136C19.505 3.5 12 3.5 12 3.5s-7.505 0-9.386.55A2.999 2.999 0 0 0 .502 6.186 31.3 31.3 0 0 0 0 12a31.3 31.3 0 0 0 .502 5.814 2.999 2.999 0 0 0 2.112 2.136C4.495 20.5 12 20.5 12 20.5s7.505 0 9.386-.55a2.999 2.999 0 0 0 2.112-2.136A31.3 31.3 0 0 0 24 12a31.3 31.3 0 0 0-.502-5.814z" />'
			+ '<path fill="#fff" d="M9.75 15.02 15.5 12 9.75 8.98v6.04z" />'
			+ '</svg>';

		const GITHUB_ICON = '<svg class="icon-github" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">'
			+ '<path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z" />'
			+ '</svg>';

		function githubRepoLabel(href) {
			const match = href.match(/^https:\/\/github\.com\/([^\/]+)\/([^\/]+)/);
			return match ? `${match[1]}/${match[2]}` : null;
		}

		function talkCard(talk, isUpcoming) {
			const links = [];
			if (talk.video) links.push({ href: talk.video, label: "Assistir no YouTube", primary: true, icon: YOUTUBE_ICON });
			if (talk.slides) links.push({ href: talk.slides, label: "Ver slides", primary: !talk.video });
			if (talk.demo) {
				const demos = Array.isArray(talk.demo) ? talk.demo : [talk.demo];
				demos.forEach((href) => {
					const repoLabel = githubRepoLabel(href);
					links.push({
						href,
						label: repoLabel || "Demo relacionada",
						primary: false,
						icon: repoLabel ? GITHUB_ICON : "",
					});
				});
			}

			const linksHtml = links
				.map((link) => {
					const external = /^https?:\/\//.test(link.href);
					const attrs = external ? ' target="_blank" rel="noopener"' : "";
					const cls = link.primary ? ' class="primary"' : "";
					const icon = link.icon || "";
					return `<a${cls} href="${escapeHtml(link.href)}"${attrs}>${icon}${escapeHtml(link.label)}</a>`;
				})
				.join("\n\t\t\t\t\t");

			return `
				<article class="talk">
					<span class="talk-badge ${isUpcoming ? "upcoming" : "past"}">${isUpcoming ? "Em breve" : "Apresentado"}</span>
					<h2>${escapeHtml(talk.title)}</h2>
					<div class="meta">
						<span>📅 ${formatDate(talk.date)}</span>
						<span>📍 ${escapeHtml(talk.location)}</span>
					</div>
					<div class="links">
						${linksHtml}
					</div>
				</article>`;
		}

		fetch("data/talks.json")
			.then((res) => res.json())
			.then((talks) => {
				const today = new Date().toISOString().slice(0, 10);
				const upcoming = talks.filter((t) => t.date >= today).sort((a, b) => a.date.localeCompare(b.date));
				const past = talks.filter((t) => t.date < today).sort((a, b) => b.date.localeCompare(a.date));

				const html = [
					...upcoming.map((t) => talkCard(t, true)),
					...past.map((t) => talkCard(t, false)),
				].join("\n");

				document.getElementById("talks").innerHTML = html;
			})
			.catch((err) => {
				document.getElementById("talks").innerHTML = '<p class="talks-status">Não foi possível carregar as talks.</p>';
				console.error(err);
			});
	</script>
</body>

</html>
